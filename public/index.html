<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#008069">
<title>פפידו — דמו בוט</title>
<style>
  /* WhatsApp look for the frame (light mode only), Papido colors for the bot's identity inside the chat */
  :root {
    --bg: #f0f2f5; --panel: #ffffff; --ink: #111b21; --muted: #667781; --line: #e9edef;
    --wa: #008069; --wa-dark: #075e54; --wa-out: #d9fdd3; --wa-in: #ffffff; --wa-wall: #efeae2; --wa-link: #027eb5;
    --brand: #d7262f; --brand-ink: #fff; --sun: #ffd400;
    --me: var(--wa-out); --bot: var(--wa-in); --chat-bg: var(--wa-wall);
    --ok: #1f7a3a;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--wa-dark); color: #fff; flex-wrap: wrap; }
  header b { color: var(--sun); font-size: 20px; letter-spacing: .5px; }
  header small { opacity: .75; }
  main { display: grid; grid-template-columns: minmax(320px, 440px) 1fr; gap: 16px; padding: 16px; max-width: 1200px; margin: 0 auto; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; padding: 10px; } }

  .phone { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; height: min(82vh, 780px); box-shadow: 0 2px 10px rgba(11,20,26,.08); }
  /* WhatsApp chat header: the contact is Papido */
  .wa-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--wa); color: #fff; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--sun); border: 2px solid var(--brand); display: grid; place-items: center; font-size: 20px; flex-shrink: 0; }
  .wa-head .name { font-weight: 600; font-size: 16px; }
  .wa-head .sub { font-size: 12px; opacity: .85; }
  /* test controls (not part of WhatsApp) */
  .phone-top { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; background: var(--bg); }
  .phone-top label { font-size: 12px; color: var(--muted); }
  .phone-top input { width: 140px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); direction: ltr; font-size: 16px; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 6px 10px; }
  #log { flex: 1; overflow-y: auto; padding: 14px 12px; background: var(--chat-bg); display: flex; flex-direction: column; gap: 6px; }
  #log > * { flex-shrink: 0; }
  /* bubbles like WhatsApp in Hebrew: customer on the left (green), Papido on the right (white) */
  .msg { max-width: 85%; padding: 6px 10px 7px; border-radius: 8px; white-space: pre-wrap; word-wrap: break-word; box-shadow: 0 1px .5px rgba(11,20,26,.13); }
  .msg a { color: var(--wa-link); }
  .me { align-self: flex-end; background: var(--me); border-top-left-radius: 0; }
  .bot { align-self: flex-start; background: var(--bot); border-top-right-radius: 0; }
  .typing { align-self: flex-start; color: var(--wa); font-size: 13px; font-style: italic; }
  .imgs { align-self: flex-start; display: flex; gap: 6px; overflow-x: auto; max-width: 92%; flex-wrap: wrap; }
  .imgs a.full { flex-basis: 100%; font-size: 13px; color: var(--wa-link); text-decoration: none; padding: 2px 4px; }
  .imgs img { height: 300px; border-radius: 8px; border: 3px solid #fff; cursor: zoom-in; background: #fff; box-shadow: 0 1px .5px rgba(11,20,26,.13); }
  /* reply buttons and lists: WhatsApp shape, Papido red */
  .opts { align-self: flex-start; display: flex; flex-wrap: wrap; gap: 6px; max-width: 85%; justify-content: flex-start; }
  .opts button { background: var(--panel); border: 1px solid transparent; color: var(--brand); border-radius: 8px; padding: 8px 14px; font-weight: 600; box-shadow: 0 1px .5px rgba(11,20,26,.13); }
  .opts button:disabled { opacity: .45; cursor: default; }
  .opts .listhead { width: 100%; text-align: left; font-size: 12px; color: var(--muted); }
  .opts button small { display: none; }
  .list { align-self: flex-start; width: 82%; background: var(--panel); border-radius: 8px; overflow: hidden; box-shadow: 0 1px .5px rgba(11,20,26,.13); }
  .list .listhead { padding: 8px 12px; font-size: 13px; font-weight: 700; color: var(--brand); border-bottom: 1px solid var(--line); }
  .list button { display: block; width: 100%; text-align: right; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; padding: 8px 12px; }
  .list button:last-child { border-bottom: 0; }
  .list button span { display: block; font-weight: 600; }
  .list button small { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; }
  .list button:hover:not(:disabled) { background: var(--bg); }
  .list button:disabled { opacity: .5; cursor: default; }
  .opts button.picked, .list button.picked { opacity: 1; background: var(--me); }
  #zoom { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; align-items: center; justify-content: center; z-index: 9; }
  #zoom img { max-height: 95vh; max-width: 95vw; border-radius: 8px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 10px; background: var(--bg); }
  .chips button { white-space: nowrap; font-size: 13px; padding: 4px 10px; border-radius: 999px; color: var(--wa); border-color: var(--line); }
  /* WhatsApp input bar */
  form { display: flex; gap: 8px; padding: 8px 10px; background: var(--bg); align-items: center; }
  form input { flex: 1; padding: 10px 14px; border-radius: 22px; border: 0; background: var(--panel); color: var(--ink); font: inherit; font-size: 16px; outline: none; }
  form .send { width: 44px; height: 44px; border-radius: 50%; border: 0; padding: 0; background: var(--wa); color: #fff; display: grid; place-items: center; flex-shrink: 0; }
  form .send svg { transform: scaleX(-1); }

  .side { display: grid; gap: 16px; align-content: start; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .card h2 { margin: 0 0 10px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
  .state div { margin: 3px 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .tickets { display: grid; gap: 10px; max-height: 46vh; overflow-y: auto; }
  .ticket { white-space: pre-wrap; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; background: var(--bg); border: 1px dashed var(--line); border-radius: 10px; padding: 10px; }
  .ticket.new { border-color: var(--ok); }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  pre.tools { white-space: pre-wrap; font-size: 12px; max-height: 220px; overflow: auto; margin: 6px 0 0; }
</style>
</head>
<body>
<header><b>PAPIDO</b><span>דמו — בוט הזמנות ושאלות</span><small>(ממשק בדיקה, בוואטסאפ זה ייראה כשיחה רגילה)</small></header>
<main>
  <section class="phone">
    <div class="wa-head">
      <div class="avatar">🍕</div>
      <div><div class="name">פיצה פפידו</div><div class="sub">בוט הזמנות · מחובר</div></div>
    </div>
    <div class="phone-top">
      <label for="cid">טלפון לקוח</label>
      <input id="cid" value="+972500000001">
      <button id="newChat" title="מתחיל שיחה חדשה, הבוט עדיין זוכר את הלקוח">שיחה חדשה</button>
      <button id="forget" title="מוחק את הלקוח — כמו לקוח שפונה בפעם הראשונה">לקוח חדש</button>
    </div>
    <div id="log"></div>
    <div class="chips" id="chips"></div>
    <form id="f"><input id="t" placeholder="הקלד הודעה" autocomplete="off" enterkeyhint="send"><button class="send" aria-label="שלח"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M1.101 21.757 23.8 12.028 1.101 2.3l.011 7.912 13.623 1.816-13.623 1.817-.011 7.912z"/></svg></button></form>
  </section>

  <section class="side">
    <div class="card">
      <h2>מטבח — הזמנות שהתקבלו <span class="muted" id="ordersCount"></span></h2>
      <div class="tickets" id="tickets"><div class="muted">עוד אין הזמנות. נסה להזמין בצ'אט.</div></div>
    </div>
    <div class="card">
      <h2>מצב השיחה</h2>
      <div class="state" id="state"><div class="muted">—</div></div>
      <details><summary>מה הבוט עשה מאחורי הקלעים</summary><pre class="tools" id="tools"></pre></details>
    </div>
  </section>
</main>

<div id="zoom" onclick="this.style.display='none'"><img alt=""></div>
<script>
const $ = (id) => document.getElementById(id);
const log = $('log');
const samples = [
  'היי', 'מה יש בתפריט?', 'עד מתי אתם פתוחים?', 'אתם כשרים?', 'מגיעים לרמות?', 'יש ללא גלוטן?',
  'אני רוצה להזמין משלוח', '2 מרגריטה L ואחת גבינה אישית בלי מרינרה', 'זהו',
  'יוסי, הרב קוק 12 מרכז העיר קומה 2, מזומן', 'מאשר', 'כמה עולה פיצה הוואי?', 'ההזמנה שלי מאחרת',
];

function add(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

function renderState(s) {
  if (!s) return;
  const svc = { delivery: 'משלוח', takeaway: 'איסוף עצמי' }[s.service] || '—';
  const cart = s.cart.length ? s.cart.map((l) => `• ${l.text} — ${l.total}₪`).join('<br>') : '—';
  const d = s.details || {};
  const c = s.customer;
  $('state').innerHTML = `
    <div><b>סוג:</b> ${svc}</div>
    <div><b>סל:</b><br>${cart}</div>
    <div><b>ביניים:</b> ${s.subtotal}₪</div>
    <div><b>פרטים:</b> ${[d.name, d.address, d.pickupTime, d.payment].filter(Boolean).join(' | ') || '—'}</div>
    <div><b>סטטוס:</b> ${s.status}</div>
    <div class="muted">שיחה: ${s.conversationId || "—"}</div>
    <div class="muted">${c ? `לקוח מוכר: ${c.name || ''} · ${c.ordersCount || 0} הזמנות` : 'לקוח חדש'}</div>`;
}

let lastOrders = 0;
async function loadOrders() {
  try {
    const resp = await fetch('/api/orders');
    if (resp.status === 401) { $('tickets').innerHTML = '<div class="muted">🔒 ההזמנות מוגנות בסיסמה — <a href="/monitor" target="_blank">כניסה</a>, ואז רעננו את הדף</div>'; return; }
    const orders = await resp.json();
    $('ordersCount').textContent = orders.length ? `(${orders.length})` : '';
    if (!orders.length) return;
    $('tickets').innerHTML = '';
    orders.forEach((o, i) => {
      const d = document.createElement('div');
      d.className = 'ticket' + (i === 0 && orders.length > lastOrders ? ' new' : '');
      d.textContent = o.ticket + '\n' + new Date(o.createdAt).toLocaleTimeString('he-IL');
      $('tickets').appendChild(d);
    });
    lastOrders = orders.length;
  } catch {}
}

async function sendText(text, payload) {
  if (!text.trim()) return;
  add(text, 'me');
  const typing = add('מקליד…', 'typing');
  try {
    const r = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ customerId: $('cid').value.trim(), text, payload: payload || null }),
    });
    const data = await r.json();
    typing.remove();
    renderImages(data.images || []);
    add(data.reply || data.error || 'שגיאה', 'bot');
    (data.links || []).forEach((l) => { const a = add('', 'bot'); a.innerHTML = `<a href="${l}" target="_blank">📄 התפריט המלא (מסמך מסודר)</a>`; });
    renderChoices(data.choices || [], data.listTitle);
    renderState(data.state);
    $('tools').textContent = (data.error ? `⚠️ שגיאה: ${data.error}\n\n` : '') +
      ((data.tools || []).map((t) => `▶ ${t.name} ${JSON.stringify(t.args)}\n← ${JSON.stringify(t.result)}`).join('\n\n') || '(בלי כלים בהודעה הזו)');
    if (data.error) $('tools').parentElement.open = true;
    loadOrders();
  } catch (e) {
    typing.remove();
    add('שגיאת חיבור לשרת', 'bot');
  }
}

function renderImages(list) {
  if (!list.length) return;
  const wrap = document.createElement('div');
  wrap.className = 'imgs';
  list.forEach((src) => {
    const img = document.createElement('img');
    img.src = src; img.alt = 'תפריט';
    img.onclick = () => { $('zoom').querySelector('img').src = src; $('zoom').style.display = 'flex'; };
    img.onload = () => { log.scrollTop = log.scrollHeight; };
    wrap.appendChild(img);
  });
  log.appendChild(wrap);
}

// up to 3 = buttons (like WhatsApp reply buttons); 4-10 = a list (like a WhatsApp list message)
function renderChoices(choices, listTitle) {
  if (!choices.length) return;
  const wrap = document.createElement('div');
  const isList = choices.length > 3;
  wrap.className = isList ? 'list' : 'opts';
  if (isList) { const h = document.createElement('div'); h.className = 'listhead'; h.textContent = '☰ ' + (listTitle || 'בחירה'); wrap.appendChild(h); }
  choices.forEach((c) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = `<span>${esc(c.title)}</span>${c.description ? `<small>${esc(c.description)}</small>` : ''}`;
    b.onclick = () => { wrap.querySelectorAll('button').forEach((x) => (x.disabled = true)); b.classList.add('picked'); sendText(c.title, c.id); };
    wrap.appendChild(b);
  });
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
}
function esc(s) { return String(s).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch])); }

$('f').addEventListener('submit', (e) => { e.preventDefault(); const t = $('t').value; $('t').value = ''; sendText(t); });
async function reset(forget) {
  await fetch('/api/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ customerId: $('cid').value.trim(), forget }) });
  log.innerHTML = '';
  $('tools').textContent = '';
  renderState(await (await fetch('/api/state?customerId=' + encodeURIComponent($('cid').value.trim()))).json());
}
$('newChat').onclick = () => reset(false);
$('forget').onclick = () => reset(true);
// first chip = what a WhatsApp "menu" shortcut would do (a tap, no AI); the rest are typed sample messages
[{ t: '📋 תפריט (לחיצה)', p: 'menu' }, ...samples.map((t) => ({ t }))].forEach((x) => {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = x.t;
  b.onclick = () => sendText(x.p ? '📋 תפריט' : x.t, x.p); $('chips').appendChild(b);
});
loadOrders();
setInterval(loadOrders, 4000);
</script>
</body>
</html>
