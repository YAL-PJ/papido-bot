.gray rect{fill:#444441;stroke:#D3D1C7} .gray .t{fill:#F1EFE8} .gray .s{fill:#D3D1C7}
.purple rect{fill:#3C3489;stroke:#AFA9EC} .purple .t{fill:#EEEDFE} .purple .s{fill:#CECBF6}
.teal rect{fill:#085041;stroke:#5DCAA5} .teal .t{fill:#E1F5EE} .teal .s{fill:#9FE1CB}
.coral rect{fill:#712B13;stroke:#F0997B} .coral .t{fill:#FAECE7} .coral .s{fill:#F5C4B3}
.blue rect{fill:#0C447C;stroke:#85B7EB} .blue .t{fill:#E6F1FB} .blue .s{fill:#B5D4F4} }
</style>
<defs><marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" width="680" height="690" rx="12"/>
<path class="a" d="M130 86 L130 126" marker-end="url(#h)"/>
<path class="a" d="M340 86 L340 126" marker-end="url(#h)"/>
<path class="a" d="M550 86 L550 126" marker-end="url(#h)"/>
<path class="a" d="M340 186 L340 226" marker-end="url(#h)"/>
<path class="a" d="M240 286 L240 312 L130 312 L130 336" marker-end="url(#h)"/>
<path class="a" d="M340 286 L340 336" marker-end="url(#h)"/>
<path class="a" d="M430 368 L456 368" marker-end="url(#h)"/>
<path class="a" d="M130 396 L130 424 L510 424 L510 400" marker-end="url(#h)"/>
<path class="a" d="M590 396 L590 456" marker-end="url(#h)"/>
<path class="a" d="M550 516 L550 556" marker-end="url(#h)"/>
<g class="gray"><rect x="40" y="30" width="180" height="56" rx="8" stroke-width="1"/><text class="t" x="130" y="49" direction="rtl">צ'אט דמו (web)</text><text class="s" x="130" y="69">/api/chat · פעיל</text></g>
<g class="gray"><rect x="250" y="30" width="180" height="56" rx="8" stroke-width="1" stroke-dasharray="5 4"/><text class="t" x="340" y="49">Twilio WhatsApp</text><text class="s" x="340" y="69" direction="rtl">עוד לא מחובר</text></g>
<g class="gray"><rect x="460" y="30" width="180" height="56" rx="8" stroke-width="1" stroke-dasharray="5 4"/><text class="t" x="550" y="49">Meta WhatsApp</text><text class="s" x="550" y="69" direction="rtl">ממתין לאימות עסק</text></g>
<g class="purple"><rect x="40" y="130" width="600" height="56" rx="8" stroke-width="1"/><text class="t" x="340" y="149">server.js — שרת Node ב-Render (free)</text><text class="s" x="340" y="169">webhooks · /monitor · /timeline (סיסמה) · /healthz</text></g>
<g class="purple"><rect x="140" y="230" width="400" height="56" rx="8" stroke-width="1"/><text class="t" x="340" y="249">agent.js — ניתוב</text><text class="s" x="340" y="269" direction="rtl">מספר→כפתור · קיצורים · אלרגיה · לחיצה · טקסט</text></g>
<g class="teal"><rect x="40" y="340" width="180" height="56" rx="8" stroke-width="1"/><text class="t" x="130" y="359">flow.js</text><text class="s" x="130" y="379" direction="rtl">לחיצות · בלי מודל</text></g>
<g class="coral"><rect x="250" y="340" width="180" height="56" rx="8" stroke-width="1"/><text class="t" x="340" y="359">Gemini (LLM)</text><text class="s" x="340" y="379" direction="rtl">טקסט חופשי + הגהה</text></g>
<g class="teal"><rect x="460" y="340" width="180" height="56" rx="8" stroke-width="1"/><text class="t" x="550" y="359">tools.js</text><text class="s" x="550" y="379" direction="rtl">סל, מחירים, הזמנה</text></g>
<g class="blue"><rect x="40" y="460" width="180" height="56" rx="8" stroke-width="1"/><text class="t" x="130" y="479">menu + catalog</text><text class="s" x="130" y="499" direction="rtl">תפריט Tabit, מידות</text></g>
<g class="blue"><rect x="250" y="460" width="180" height="56" rx="8" stroke-width="1"/><text class="t" x="340" y="479">business.json</text><text class="s" x="340" y="499" direction="rtl">שעות, אזורים, אלרגנים</text></g>
<g class="blue"><rect x="460" y="460" width="180" height="56" rx="8" stroke-width="1"/><text class="t" x="550" y="479">Upstash Redis</text><text class="s" x="550" y="499" direction="rtl">שיחות, הזמנות, לוגים</text></g>
<g class="gray"><rect x="40" y="560" width="180" height="56" rx="8" stroke-width="1" stroke-dasharray="5 4"/><text class="t" x="130" y="579" direction="rtl">התראה לצוות/מטבח</text><text class="s" x="130" y="599" direction="rtl">עדיין placeholder</text></g>
<g class="purple"><rect x="460" y="560" width="180" height="56" rx="8" stroke-width="1"/><text class="t" x="550" y="579">/monitor + /timeline</text><text class="s" x="550" y="599" direction="rtl">כל פעולה בשורה</text></g>
<text class="lg" x="340" y="650" direction="rtl">מסגרת מקווקווה = עוד לא פעיל · מחירים וחישובים רק בקוד (tools.js), לא במודל</text>
</svg>
