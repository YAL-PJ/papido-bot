<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 690" width="680" height="690" font-family="system-ui,-apple-system,'Segoe UI',Arial,sans-serif">
<title>Papido bot — architecture</title>
<style>
.bg{fill:#ffffff} .a{stroke:#73726c;fill:none;stroke-width:1.2} .lg{fill:#73726c;font-size:12px}
text{text-anchor:middle;dominant-baseline:central} .t{font-size:14px;font-weight:600} .s{font-size:12px}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A} .gray .t{fill:#444441} .gray .s{fill:#5F5E5A}
.purple rect{fill:#EEEDFE;stroke:#534AB7} .purple .t{fill:#3C3489} .purple .s{fill:#534AB7}
.teal rect{fill:#E1F5EE;stroke:#0F6E56} .teal .t{fill:#085041} .teal .s{fill:#0F6E56}
.coral rect{fill:#FAECE7;stroke:#993C1D} .coral .t{fill:#712B13} .coral .s{fill:#993C1D}
.blue rect{fill:#E6F1FB;stroke:#185FA5} .blue .t{fill:#0C447C} .blue .s{fill:#185FA5}
